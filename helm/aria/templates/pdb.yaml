{{- if .Values.api.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aria.fullname" . }}-api-pdb
  labels:
    {{- include "aria.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "aria.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
