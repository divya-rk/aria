{{- if .Values.keda.enabled }}
---
{{- if .Values.hydration.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "aria.fullname" . }}-hydration-scaler
  labels:
    {{- include "aria.labels" . | nindent 4 }}
    app.kubernetes.io/component: hydration
spec:
  scaleTargetRef:
    name: {{ include "aria.fullname" . }}-hydration
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.hydration.keda.minReplicas }}
  maxReplicaCount: {{ .Values.hydration.keda.maxReplicas }}
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: {{ include "aria.fullname" . }}-aws-credentials
      metadata:
        queueURL: {{ .Values.queues.hydrationInput }}
        queueLength: {{ .Values.hydration.keda.queueLength | quote }}
        awsRegion: {{ .Values.global.region }}
        identityOwner: operator
{{- end }}
