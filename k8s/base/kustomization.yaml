apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: aria-pipeline

namespace: aria

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - queues-configmap.yaml
  - pdb.yaml
  - hydration-worker.yaml
  - curation-worker.yaml
  - embedding-worker.yaml
  - tokenization-worker.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: aria-pipeline
