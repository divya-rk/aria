apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-config
  namespace: aria
  labels:
    app.kubernetes.io/name: aria
    app.kubernetes.io/component: config
data:
  # AWS Configuration
  AWS_REGION: "us-east-1"

  # S3 Buckets - will be patched per environment
  RAW_BUCKET: "${PROJECT}-raw-${ENVIRONMENT}"
  OUTPUT_BUCKET: "${PROJECT}-output-${ENVIRONMENT}"
  LANCEDB_BUCKET: "${PROJECT}-lancedb-${ENVIRONMENT}"

  # DynamoDB
  DYNAMODB_TABLE: "${PROJECT}-pipeline-state-${ENVIRONMENT}"

  # Processing Configuration
  LOG_LEVEL: "INFO"
  BATCH_SIZE: "10"

  # Whisper Configuration (Hydration)
  WHISPER_MODEL: "large-v3"
  WHISPER_DEVICE: "cuda"
  WHISPER_COMPUTE_TYPE: "float16"

  # Quality Thresholds (Curation)
  QUALITY_THRESHOLD_HIGH: "0.8"
  QUALITY_THRESHOLD_MEDIUM: "0.6"
  QUALITY_THRESHOLD_LOW: "0.4"

  # Embedding Configuration
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  EMBEDDING_DIMENSION: "384"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"

  # Tokenization Configuration
  TOKENIZER_MODEL: "cl100k_base"
  SHARD_SIZE_TOKENS: "100000000"
