---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hydration-pdb
  namespace: aria
  labels:
    app.kubernetes.io/name: aria
    app.kubernetes.io/component: hydration
spec:
  minAvailable: 0  # Allow scale to zero
  selector:
    matchLabels:
      app.kubernetes.io/name: aria
      app.kubernetes.io/component: hydration
